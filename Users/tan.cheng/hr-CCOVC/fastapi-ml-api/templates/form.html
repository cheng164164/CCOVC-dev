<!DOCTYPE html>
<html>
<head>
    <title>HR CC/OVC Classifier</title>
</head>
<body>
    <h2>Predict CC / OVC</h2>
    <form action="/predict_form" method="post">
        <label>Legal Entity:</label>
        <select name="Legal_Entity_Label">
            {% for item in legal_entities %}
                <option value="{{ item }}" {% if item == Legal_Entity_Label %}selected{% endif %}>{{ item }}</option>
            {% endfor %}
        </select><br><br>

        <label>Business Unit:</label>
        <select name="Business_Unit_Label">
            {% for item in business_units %}
                <option value="{{ item }}" {% if item == Business_Unit_Label %}selected{% endif %}>{{ item }}</option>
            {% endfor %}
        </select><br><br>

        <label>Employment Type:</label>
        <select name="Employment_Type_Label">
            {% for item in employment_types %}
                <option value="{{ item }}" {% if item == Employment_Type_Label %}selected{% endif %}>{{ item }}</option>
            {% endfor %}
        </select><br><br>

        <label>Job Classification:</label>
        <input list="job_classification_list" name="Job_Classification_Label" value="{{ Job_Classification_Label or '' }}">
        <datalist id="job_classification_list">
            {% for item in job_classification %}
                <option value="{{ item }}">
            {% endfor %}
        </datalist>
        <br><br>

        <input type="submit" value="Predict">
    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
        <p>Probability of OVC: {{ probability }}</p>
    {% endif %}
</body>
</html>
